# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# GASPAR — configuração do Sveltia CMS
# Edita diretamente os JSONs em site/content/.
#
# Como usar:
#   • Local (dev):  npm run dev → abra http://localhost:5173/admin/index.html
#                   → "Work with Local Repository" → selecione a PASTA RAIZ do projeto.
#                   Sem login (o CMS grava direto nos arquivos locais).
#   • Produção:     abra /admin/ no site no ar → "Sign In with Token" →
#                   cole um Personal Access Token do GitHub (permissões:
#                   Contents Read/Write + Pull requests Read/Write).
#
# TODO (Fase 4): troque `repo` pelo seu owner/repo real e defina `site_url`.

site_url: https://gaspar.pages.dev
backend:
  name: github
  repo: gaspar/pagina-gaspar
  branch: main

media_folder: site/public/uploads
public_path: /uploads

locale: pt

collections:
  - name: settings
    label: Configurações
    icon: settings
    files:
      - name: settings
        label: Marca, contato e métricas
        file: site/content/settings.json
        format: json
        fields:
          - label: Marca
            name: brand
            widget: string
          - label: Assinatura (logo)
            name: tagline
            widget: string
          - label: Telefone (como aparece na página)
            name: phoneDisplay
            widget: string
          - label: WhatsApp (só números, com DDI)
            name: whatsapp
            widget: string
            hint: "Ex.: 5515999999999 — o botão abre wa.me com esse número"
            pattern: ["^[0-9]{10,13}$", "Use apenas números (10 a 13 dígitos)"]
          - label: Mensagem pré-preenchida do WhatsApp
            name: whatsappMsg
            widget: text
          - label: Menu
            name: nav
            widget: list
            hint: "Links âncora da página (ex.: #servicos, #contato)"
            fields:
              - { label: Texto, name: label, widget: string }
              - { label: Link, name: href, widget: string }
          - label: Métricas (IDs — vazio = desligado)
            name: analytics
            widget: object
            collapsed: false
            fields:
              - { label: Clarity ID, name: clarityId, widget: string, required: false, hint: "clarity.microsoft.com" }
              - { label: Cloudflare Web Analytics Token, name: cfBeaconToken, widget: string, required: false }
              - { label: Umami URL, name: umamiUrl, widget: string, required: false, hint: "Ex.: https://analytics.seudominio.com" }
              - { label: Umami Website ID, name: umamiWebsiteId, widget: string, required: false }

  - name: home
    label: Página inicial
    icon: home
    files:
      - name: home
        label: Landing
        file: site/content/home.json
        format: json
        fields:
          - label: SEO
            name: seo
            widget: object
            collapsed: false
            fields:
              - { label: Título da aba, name: title, widget: string }
              - { label: Descrição (Google), name: description, widget: text }

          - label: Hero
            name: hero
            widget: object
            collapsed: false
            fields:
              - { label: Eyebrow (linha pequena em cima), name: eyebrow, widget: string }
              - { label: Título — linha 1 (preta), name: title1, widget: string }
              - { label: Título — linha 2 (coral), name: title2, widget: string }
              - { label: Texto de apoio, name: sub, widget: text }
              - { label: Botão principal, name: cta, widget: string }
              - { label: Link secundário, name: ctaSecondary, widget: string }
              - { label: Botão do header, name: headerCta, widget: string }

          - label: Números (barra de prova)
            name: stats
            widget: list
            hint: "3 itens: diagnóstico grátis, prazo, zero compromisso"
            fields:
              - { label: Valor, name: value, widget: string }
              - { label: Legenda, name: label, widget: string }

          - label: Faixa escura (compromissos)
            name: marquee
            widget: list
            field: { label: Compromisso, name: item, widget: string }

          - label: A dura realidade (dores)
            name: problem
            widget: object
            collapsed: false
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Título — linha 1, name: title1, widget: string }
              - { label: Título — linha 2, name: title2, widget: string }
              - label: Dores (3)
                name: items
                widget: list
                fields:
                  - { label: Título, name: title, widget: string }
                  - { label: Texto, name: body, widget: text }

          - label: Serviços
            name: services
            widget: object
            collapsed: false
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Título — linha 1, name: title1, widget: string }
              - { label: Título — linha 2, name: title2, widget: string }
              - { label: Etiqueta do card destaque, name: featuredTag, widget: string }
              - label: Serviços (4 cards)
                name: items
                widget: list
                fields:
                  - { label: Número, name: num, widget: string }
                  - { label: Título, name: title, widget: string }
                  - { label: Texto, name: body, widget: text }

          - label: Como funciona
            name: process
            widget: object
            collapsed: false
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Título, name: title, widget: string }
              - label: Passos (4)
                name: steps
                widget: list
                fields:
                  - { label: Número, name: num, widget: string }
                  - { label: Título, name: title, widget: string }
                  - { label: Texto, name: body, widget: text }

          - label: Confiança (seção escura)
            name: trust
            widget: object
            collapsed: false
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: Texto pessoal, name: body, widget: text }
              - label: Garantias (3)
                name: items
                widget: list
                field: { label: Garantia, name: item, widget: string }

          - label: Perguntas frequentes
            name: faq
            widget: object
            collapsed: false
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Título, name: title, widget: string }
              - label: Perguntas (4)
                name: items
                widget: list
                fields:
                  - { label: Pergunta, name: q, widget: string }
                  - { label: Resposta, name: a, widget: text }

          - label: CTA final
            name: cta
            widget: object
            collapsed: false
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Texto de apoio, name: sub, widget: text }
              - { label: Botão WhatsApp, name: button, widget: string }
              - { label: Micro-texto (form), name: micro, widget: string }
              - { label: Texto da barra fixa (mobile), name: stickyBar, widget: string }
              - label: Formulário
                name: form
                widget: object
                collapsed: false
                fields:
                  - { label: Título do card, name: title, widget: string }
                  - { label: Campo Nome, name: name, widget: string }
                  - { label: Campo WhatsApp, name: whatsapp, widget: string }
                  - { label: Campo Negócio, name: business, widget: string }
                  - { label: Placeholder Nome, name: namePlaceholder, widget: string, required: false }
                  - { label: Placeholder WhatsApp, name: whatsappPlaceholder, widget: string, required: false }
                  - { label: Placeholder Negócio, name: businessPlaceholder, widget: string, required: false }
                  - { label: Botão, name: submit, widget: string }
                  - { label: Mensagem de sucesso, name: success, widget: text }
                  - { label: Nota de privacidade, name: privacy, widget: string }

          - label: Rodapé
            name: footer
            widget: object
            collapsed: false
            fields:
              - { label: Texto esquerda, name: left, widget: string }
              - { label: Texto direita, name: right, widget: string, hint: "{year} é substituído pelo ano atual" }
