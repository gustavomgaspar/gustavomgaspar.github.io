[package]
name = "pagina-gaspar"
version = "0.1.0"
edition = "2021"
description = "Landing de modernização digital para empresas consolidadas"
authors = ["Gaspar"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.0" }
leptos_meta = { version = "0.8.0" }
leptos_router = { version = "0.8.0" }
leptos_axum = { version = "0.8.0", optional = true }
axum = { version = "0.8.0", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

# Perfil otimizado para o bundle WASM em release
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "pagina_gaspar"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
style-file = "public/styles/app.css"
site-addr = "127.0.0.1:3000"
reload-port = 3001
# Issue leptos-rs/leptos#3945: em release, o erase-components remove os
# comentários-marcadores que a hidratação do <Stylesheet> espera.
disable-erase-components = true
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
browserquery = "defaults"
